# Swing Classifier Configuration

# Directory paths
data:
  raw_dir: 'archive(1)/VIDEO_RGB'
  processed_dir: 'data/processed'

# Model configuration
model:
  pose_extractor_path: 'models/yolov8x-pose.pt'  # YOLO-Pose model for person detection and keypoint extraction
  smart_crop: true                  # Enable Smart Crop (zoom on detected person)
  use_motionbert: true              # Enable MotionBERT 3D lifting
  motionbert_path: 'models/MB_ft_h36m.pth' # Path to MotionBERT checkpoint (Download: https://1drv.ms/f/s!AvAdh0LSjEOlgSoTqtyR5Zsgi8_Z?e=rn4VJf)

# Hyperparameters
hyperparameters:
  seq_len: 40               # Sequence length
  num_joints: 17            # COCO skeleton joints
  confidence_thresh: 0.25   # YOLO confidence threshold

# Training configuration
training:
  batch_size: 32
  epochs: 60
  learning_rate: 0.001
  weight_decay: 0.0001
  val_split: 0.2            # Validation split ratio
  random_seed: 42
  num_workers: 2
  early_stopping_patience: 10  # Stop if no improvement for N epochs
  checkpoint_frequency: 5       # Save checkpoint every N epochs
  monitor_metric: 'f1'          # Metric to monitor: 'f1' or 'loss'
  modality: 'joint'             # 'joint' or 'bone'

  augment: true                # Enable/disable data augmentation
  robust_validation: true       # Enable/disable robust validation with forced back view
  default_augmentation_strength: 'medium'  # Default strength if curriculum learning is disabled ('weak', 'medium', 'strong')
  
  # Curriculum Learning
  use_curriculum_learning: true  # Enable/disable curriculum learning for augmentation
  curriculum_schedule: 'linear'  # 'linear', 'exponential', or 'step'
                                  # - linear: gradual transition weak -> medium -> strong
                                  # - exponential: slow start, fast end
                                  # - step: abrupt transitions (0-33% weak, 33-66% medium, 66-100% strong)
  
# Model hyperparameters
model_hyperparameters:
  type: 'HDGCN'             # 'HDGCN' or 'CTRGCN'
  dropout: 0.5
  in_channels: 4            # Input channels (4 for X,Y,Z,Conf)

  
# Output paths
output:
  model_save_path: 'models/best_model_hdgcn.pth'
  plots_output_dir: 'runs'
  analysis_output_dir: 'runs/analysis'
  folds_output_dir: 'runs/kfold_results'
  evaluation_dir: 'runs/evaluation_tta'
  checkpoints_dir: 'models/checkpoints'

# Evaluation/Testing configuration
evaluation:
  batch_size: 32
  tta_enabled: true        # Test Time Augmentation
  tta_augmentations:
    - scale: 1.05          # 5% zoom on X,Y coordinates
      noise: 0.0           # No noise for this pass
    - scale: 1.0           # Original
      noise: 0.01          # 1% noise on X,Y coordinates